<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Survivor Speed Rankings</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page">
      <header class="hero">
        <h1>Survivor Speed Rankings</h1>
        <p>Compare player performances using S–F letter grades across your own scores, a friend's scores, and historical results.</p>
      </header>

      <section class="table-card">
        <table>
          <thead>
            <tr>
              <th scope="col">Player</th>
              <th scope="col">My Grades</th>
              <th scope="col">Friend's Grades</th>
              <th scope="col">Historical Grades</th>
              <th scope="col">Final Grade</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td data-label="Player">Ava</td>
              <td data-label="My Grades">A</td>
              <td data-label="Friend's Grades">B</td>
              <td data-label="Historical Grades">A</td>
              <td class="final-grade" data-label="Final Grade"></td>
            </tr>
            <tr>
              <td data-label="Player">Noah</td>
              <td data-label="My Grades">C</td>
              <td data-label="Friend's Grades">A</td>
              <td data-label="Historical Grades">B</td>
              <td class="final-grade" data-label="Final Grade"></td>
            </tr>
            <tr>
              <td data-label="Player">Mina</td>
              <td data-label="My Grades">A</td>
              <td data-label="Friend's Grades">S</td>
              <td data-label="Historical Grades">S</td>
              <td class="final-grade" data-label="Final Grade"></td>
            </tr>
            <tr>
              <td data-label="Player">Leo</td>
              <td data-label="My Grades">D</td>
              <td data-label="Friend's Grades">C</td>
              <td data-label="Historical Grades">C</td>
              <td class="final-grade" data-label="Final Grade"></td>
            </tr>
          </tbody>
        </table>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
